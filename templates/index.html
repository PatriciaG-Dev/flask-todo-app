
<!DOCTYPE html>
<html>
<head>
    <title>Mi To-Do App</title>
</head>
<body>

    <h1>Lista de Tareas</h1>

    <form action="/add" method="POST">
        <input type="text" name="task" placeholder="Escribe una tarea">
        <button type="submit">Agregar</button>
    </form>

    <ul>
        {% for task in tasks %}
            <li>{{ task }}</li>
        {% endfor %}
    </ul>

</body>
</html>
